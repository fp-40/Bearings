[project]
name = "pybearings"
version = "0.1.0"
description = "Bearings, the Free Pascal HTTP/1.1 server, as a WSGI server for Python"
readme = "README.md"
license = "MIT"
authors = [{ name = "Juan Pablo Scaletti", email = "juanpablo@jpscaletti.com" }]
requires-python = ">=3.12"
dependencies = ["cffi>=2.0"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Server",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bearings"]
# libbearings.so and bearings.h: compiled and added by hatch_build.py

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
lines-after-imports = 2
