[project]
name = "pybearings"
version = "0.3.0"
description = "Bearings, the Free Pascal HTTP/1.1 server, as a WSGI server for Python"
readme = "README.md"
license = "MIT"
authors = [{ name = "Juan Pablo Scaletti", email = "juanpablo@jpscaletti.com" }]
requires-python = ">=3.14"
dependencies = ["cffi>=2.0"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Server",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
# the editable install keeps the libbearings.so it compiled: build it again
# when the Pascal sources (or the hook that compiles them) change
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "../src/**/*.pas" },
    { file = "../src/**/*.inc" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/bearings"]
# libbearings.so and bearings.h: compiled and added by hatch_build.py

[tool.hatch.build.targets.sdist]
only-include = ["src/bearings", "tests", "hatch_build.py", "README.md"]
# compiled by hatch_build.py when the wheel is built
exclude = ["src/bearings/libbearings.so", "src/bearings/bearings.h"]

[tool.hatch.build.targets.sdist.force-include]
# the Pascal sources hatch_build.py compiles, from the repository
"../src" = "pascal"
"../LICENSE" = "LICENSE"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "hatchling>=1.32.4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.9",
    "ty",
]


[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "TYPE_CHECKING",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "except ImportError:",
]
[tool.coverage.html]
directory = "covreport"


[tool.ty.src]
exclude = [
    "**/tests/",
    "_*",
    ".*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
importmode = "importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--doctest-modules"

[tool.tox]
legacy_tox_ini = """
[tox]
env_list =
    3.14t
    3.15t

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    dev
    test
commands =
    pytest -x src/bearings tests
"""

[tool.ruff]
line-length = 90
indent-width = 4
target-version = "py314"
exclude = [
    ".*",
    "_*",
    "build",
    "covreport",
    "dist",
]
include = ["*.py"]

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"
# Indent with spaces, rather than tabs.
indent-style = "space"
# Respect magic trailing commas.
skip-magic-trailing-comma = false
# Automatically detect the appropriate line ending.
line-ending = "auto"
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false
# Set the line length limit used when formatting code snippets in
# docstrings.
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
        # x is too complex
        "C901",
        # whitespace before ':'
        "E203",
        "E501",
        # x defined from star imports
        "F405",
        # line break before binary operator
        "W505",
        "W605",
]
select = [
        # bugbear
        "B",
        # mccabe"", comprehensions, commas
        "C",
        # pycodestyle errors
        "E",
        # pyflakes
        "F",
        # logging format
        "G",
        # imports
        "I",
        # quotes
        "Q",
        # pycodestyle warnings
        "W",
]

[tool.ruff.lint.isort]
known-first-party = ["bearings"]
known-local-folder = ["src/bearings"]
no-lines-before = ["local-folder"]
relative-imports-order = "furthest-to-closest"
# Use two line after imports.
lines-after-imports = 2
