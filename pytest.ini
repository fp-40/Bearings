[pytest]
# One runner for every test of the repository (README.md, "Building and
# testing"): tests/ builds and runs the Pascal suites, the expected-value
# drivers, the fuzz, the valgrind runs and the conformance cases;
# python/tests is the pybearings test suite. Run from the python/ project
# environment: `uv run --project python pytest ...` (make test, make test-full).
testpaths = tests python/tests
markers =
    fast: the fast tier (make test; CI on every push)
    full: the full tier (make test-full; needs tools/get-tools.sh)
    unit: an fpcunit suite
    heaptrc: an fpcunit suite built with heaptrc (0 unfreed blocks)
    drd: a suite under valgrind --tool=drd
    valgrind: a run under valgrind memcheck
    fuzz: the split fuzz
    golden: the expected-value tests (tests/golden)
    conformance: the wire conformance cases (conformance/)
    python: the pybearings tests
    stress: the end-to-end worker stress
    hostonly: runs on x86_64 only (skipped with TARGET=aarch64)
addopts = -ra
pythonpath = tests
# tests/unit holds the Pascal suites and the corpus generators, not pytest tests
norecursedirs = .* build unit golden support
