name: Upload to PyPI

on:
  # Triggers the workflow when a release is created
  release:
    types: [released]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  build:
    needs: validate
    name: build ${{ matrix.runner }}
    strategy:
      matrix:
        # x86_64 and aarch64: the hook tags each wheel for the CPU it built
        # on, and for the newest glibc symbol libbearings.so needs
        include:
          # the sdist too, once: its wheel is built from it, which tests it
          - runner: ubuntu-24.04
            build: uv build
          - runner: ubuntu-24.04-arm
            build: uv build --wheel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: "Builds the package"
        run: cd python && ${{ matrix.build }}

      - name: "Lists the files"
        run: ls -l python/dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.runner }}
          path: python/dist/*

  upload:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pybearings
    permissions:
      # Required for PyPI Trusted Publishing
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: "Uploads to PyPI"
        run: uv publish --trusted-publishing always dist/*
