name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Called by upload-to-pypi.yml before it builds the wheels
  workflow_call:

jobs:
  validate:
    name: validate
    strategy:
      matrix:
        python: ['3.14t', '3.15t']
      fail-fast: false
    runs-on: ubuntu-latest

    steps:
      # before the setup action: it is a file of this repository
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: "Install dependencies"
        run: cd python && uv sync --group dev --python ${{ matrix.python }}

      - name: "Lint"
        run: cd python && make lint

      - name: "Test"
        run: cd python && make test

  pascal:
    name: pascal (fast tier)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Free Pascal 3.2.2 (and uv, unused here)
      - uses: ./.github/actions/setup

      - name: "Unit tests"
        run: make test-pascal

      - name: "Upload the test logs"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pascal-test-logs
          # the logs, not the binaries
          path: |
            build/unit/**/*.log
            build/unit/**/*.out
            build/unit/**/*.txt
            build/unit/**/*.heap
