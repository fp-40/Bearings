name: Setup
description: Installs uv and Free Pascal 3.2.2, which hatch_build.py compiles libbearings.so with

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0  # no floating v10 tag

    - name: Install system dependencies
      shell: bash
      # update first: the runner image's package lists go stale and the
      # mirror answers 404 for the versions they name; no recommends: the
      # library needs the compiler and the RTL, FCL and base units only,
      # not the SDL, VLC and GTK development packages fpc recommends
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fpc-3.2.2
